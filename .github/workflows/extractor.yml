name: Game data extractor

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/game-extract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the extractor suite
        run: python -m pytest tests -q

      - name: Check the committed artefact against the repo oracle
        run: >-
          python -m pytest -q
          "tests/integration/test_real_extraction.py::test_committed_artifact_satisfies_the_oracle"
